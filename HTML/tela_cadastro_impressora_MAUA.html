<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../css/style_cadastro_impressora_MAUA.css" />
  <title>Cadastrar impressora/instituição</title>
</head>
<body>

  <header class="topo">
    <nav class="menu">
      <a href="tela_inicio_MAUA.html">Início</a>
      <a href="tela_cadastro_impressora_MAUA.html" class="ativo">Cadastrar impressora/instituição</a>
      <a>Painel de demanda</a>
    </nav>
  </header>

  <main class="pagina">
    <h1>Cadastrar impressora/instituição</h1>
    <p class="subtitulo">
      Disponibilize seu instituto, impressora e materiais para a impressão 3D de próteses.
    </p>

    <form id="formCapacidade" class="card">

      <div class="grupo">
        <label for="instituicao">Instituição</label>
        <input type="text" id="instituicao" name="instituicao" required />
      </div>

      <div class="linha">
        <div class="grupo">
          <label for="impressora">Modelo da impressora</label>
          <input type="text" id="impressora" name="impressora" required />
        </div>

        <div class="grupo">
          <label for="horas">Horas disponíveis</label>
          <input type="number" id="horas" name="horas" min="0" required />
        </div>
      </div>

      <div class="grupo">
        <span class="rotulo">Materiais disponíveis</span>
        <div class="opcoes opcoes-chip">
          <label><input type="checkbox" name="materiais" value="PLA" /><span>PLA</span></label>
          <label><input type="checkbox" name="materiais" value="PETG" /><span>PETG</span></label>
          <label><input type="checkbox" name="materiais" value="ABS" /><span>ABS</span></label>
          <label><input type="checkbox" name="materiais" value="TPU" /><span>TPU</span></label>
        </div>
      </div>

      <div class="grupo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required />
      </div>

      <div class="grupo">
        <label for="contato">Contato responsável</label>
        <input type="text" id="contato" name="contato" required />
      </div>

      <button type="submit" class="botao">Registrar impressora</button>
    </form>
  </main>

  <script>
    document.getElementById("formCapacidade").addEventListener("submit", function (e) {
      e.preventDefault();
      window.location.href = "tela_inicio_MAUA.html"; 
    });
  </script>
</body>
</html>
